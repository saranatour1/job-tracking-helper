name: Bug report
description: Something in the app doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Don't paste resumes, emails, tokens or anyone's personal details. Security bugs go through the [private form](https://github.com/saranatour1/job-tracking-helper/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Applications
        2. Open a card
        3. Press Save
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - The live site
        - My own copy, running locally
        - My own deployed copy
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on an iPhone
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or errors from the console. Check them for personal details first.
